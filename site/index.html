<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Travel Map</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="signin-view" class="signin" hidden>
    <form id="signin-form" class="card">
      <h1>Travel Map</h1>
      <p class="card-note">Please sign in</p>
      <label>
        Email
        <input id="email" type="email" autocomplete="email" required>
      </label>
      <label>
        Password
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <button id="signin-button" type="submit">Sign in</button>
      <p id="signin-error" class="error" role="alert" hidden></p>
    </form>
  </section>

  <section id="map-view" class="map-view" hidden>
    <header class="topbar">
      <span class="title">Travel Map</span>
      <span id="status" class="status" role="status"></span>
      <label class="style-picker">
        Style
        <select id="style-select"></select>
      </label>
      <span id="user-email" class="user-email"></span>
      <button id="signout-button" type="button">Sign out</button>
    </header>
    <div id="map"></div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
          integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"
          crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="maps-loader.js"></script>
  <script src="app.js"></script>
</body>
</html>
