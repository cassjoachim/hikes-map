# Keeps both free-plan Supabase projects from auto-pausing.
# Supabase pauses a free project after 7 days without activity, so this
# sends one small read request to each project every 3 days.
# Uses only the publishable keys (safe to expose), stored as repo secrets.

name: Supabase keep-alive

on:
  schedule:
    - cron: "17 15 */3 * *" # 15:17 UTC (7:17 or 8:17 AM Pacific), every 3rd day
  workflow_dispatch: # adds a "Run workflow" button for a manual check

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hikes map project (cassjoachim's Project)
        env:
          KEY: ${{ secrets.HIKES_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail-with-body -sS --retry 3 \
            "https://lnkttywvyqhgvnpcoasn.supabase.co/rest/v1/hikes_map?select=id&limit=1" \
            -H "apikey: $KEY"
          echo " <- hikes project answered"

      - name: Service requests project
        env:
          KEY: ${{ secrets.SERVICE_REQUESTS_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl --fail-with-body -sS --retry 3 -X POST \
            "https://iebfjloqpxoqykhaxqni.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
          echo " <- service-requests project answered"
